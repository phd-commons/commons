[project]
name = "phd-commons"
version = "0.1.2"
description = "A local-first research system for doctoral students: a knowledge base with verified claims, a daily research feed, grounded Q&A, thesis testing and exports. Bring your own LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Aco Kovaceski" }]
keywords = ["phd", "research", "rag", "knowledge-base", "llm", "thesis", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "pyyaml>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "feedparser>=6",
  "beautifulsoup4>=4.12",
  "mcp>=1.2",
]

[project.optional-dependencies]
local-embed = ["sentence-transformers>=3"]
docling = ["docling>=2"]
web = ["trafilatura>=1.8"]
audio = ["faster-whisper>=1"]
audio-mac = ["mlx-whisper"]
mlx = ["mlx-lm"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
commons = "phd_commons.cli:app"

[project.urls]
Homepage = "https://github.com/phd-commons/commons"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phd_commons"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
