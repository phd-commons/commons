<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Commons{% endblock %} · Commons</title>
<style>
:root {
  --bg: #f7f7f4; --panel: #ffffff; --ink: #1b1f24; --muted: #5b6470; --line: #e3e3dc;
  --accent: #1f3864; --accent-ink: #ffffff; --green: #2f7d4f; --amber: #a86b00; --red: #b3261e;
  --code: #f0efe9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --panel: #1b1f24; --ink: #e8e6e1; --muted: #9aa3ad; --line: #2b3138;
    --accent: #8fb0e6; --accent-ink: #0e1116; --green: #6cc28f; --amber: #e2a73a; --red: #f08a82; --code: #222830;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }
header { background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .02em; color: var(--accent); text-decoration: none; }
nav a { color: var(--muted); text-decoration: none; margin-right: 14px; }
nav a:hover, nav a.on { color: var(--ink); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
.pill.GREEN { color: var(--green); border-color: var(--green); }
.pill.AMBER { color: var(--amber); border-color: var(--amber); }
.pill.RED { color: var(--red); border-color: var(--red); }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 14px; } h2 { font-size: 17px; margin: 22px 0 8px; } h3 { font-size: 15px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat b { display: block; font-size: 22px; } .stat span { color: var(--muted); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); } .small { font-size: 13px; }
a { color: var(--accent); }
textarea, input[type=text], select { width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
button, .btn { font: inherit; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
  padding: 8px 14px; cursor: pointer; text-decoration: none; display: inline-block; }
.btn.ghost, button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
blockquote { margin: 6px 0; padding: 6px 12px; border-left: 3px solid var(--line); color: var(--ink); background: var(--code); border-radius: 0 6px 6px 0; }
.cite { text-decoration: none; font-weight: 600; }
.warn { color: var(--amber); } .bad { color: var(--red); } .good { color: var(--green); }
.answer p { margin: 0 0 10px; }
.scroll { overflow-x: auto; }
form.inline { display: inline; }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">Commons</a>
  <nav>
    <a href="/">Today</a><a href="/ask">Ask</a><a href="/library">Library</a><a href="/thesis">Thesis</a>
    <a href="/review">Review{% if review_open %} ({{ review_open }}){% endif %}</a><a href="/doctor">Doctor</a>
  </nav>
  <span class="muted small" style="margin-left:auto">{{ project.title or "Untitled thesis" }}</span>
</div></header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="bar muted small">Commons {{ version }} · local only · nothing leaves this machine unless you configured a cloud provider</footer>
</body>
</html>
